syntax = "proto3";

option go_package = "./";

service TorrentStore {
  // Pushes torrent to the store
  rpc Push (PushRequest) returns (PushReply) {}

  // Pulls torrent from the store. A private torrent pulled with Caller.uid
  // comes with the trackers of that uid's record and caller_trackers set;
  // every other pull returns the stored copy, without trackers for a private
  // torrent under PRIVATE_ACCESS_ENFORCE.
  rpc Pull (PullRequest) returns (PullReply) {}

  // Touch torrent in the store
  rpc Touch (TouchRequest) returns (TouchReply) {}

  // Files returns the lightweight file manifest (paths + sizes, no piece
  // hashes) of a torrent. The manifest is immutable per infoHash and is
  // cached in the multi-level store, so listing avoids transferring and
  // parsing the full .torrent on every request.
  rpc Files (FilesRequest) returns (FilesReply) {}

  // Fingerprint returns content fingerprints identifying a torrent's payload
  // independently of its infoHash: re-wrapping the same bytes under a new
  // name changes the infoHash but not the fingerprint. Derived from the
  // stored .torrent and cached like the manifest, so callers get a few bytes
  // instead of pulling and parsing the whole thing.
  rpc Fingerprint (FingerprintRequest) returns (FingerprintReply) {}

  // ListPrivateRecords lists every record of uid, without trackers.
  rpc ListPrivateRecords         (ListPrivateRecordsRequest)         returns (ListPrivateRecordsReply) {}

  // DeletePrivateRecordsByUser deletes every record of uid.
  rpc DeletePrivateRecordsByUser (DeletePrivateRecordsByUserRequest) returns (DeletePrivateRecordsReply) {}
}

// Caller is declared by the caller; there is no gRPC auth. uid is verified by
// the caller and is ^[0-9a-f]{40}$ or empty. A request without Caller comes
// from an old caller.
message Caller {
  string uid    = 1;
  bool internal = 2;
}

// The push response message containing info hash of the pushed torrent file.
// record_outcome is inserted|updated|unchanged; empty for a public torrent,
// a push without Caller, or an old store.
message PushReply {
  string infoHash       = 1;
  string record_outcome = 2;
}

// The push request message containing the torrent and expire duration is seconds.
// source is site|rapidapi|magnet|vault.
message PushRequest {
  bytes torrent = 1;
  int32 expire  = 2 [deprecated=true];
  Caller caller = 3;
  string source = 4;
  bool dry_run  = 5;
}

// The pull request message containing the infoHash
message PullRequest {
  string infoHash = 1;
  Caller caller   = 2;
}

// The pull response message containing the torrent. caller_trackers is true
// when torrent carries the trackers of Caller.uid's record and none of the
// stored copy's: such a reply is for that uid only, never cache it by info
// hash or hand it to another user. false in every other case and from an old
// store.
message PullReply {
  bytes torrent        = 1;
  bool caller_trackers = 2;
}

// The check request message containing the infoHash
message CheckRequest {
  string infoHash = 1;
}

// The check response message containing existance flag
message CheckReply {
  bool exists = 1;
}

// The touch response message. access is "allowed" on every successful Touch
// with Caller; empty from an old store.
message TouchReply {
  string access = 1;
}

// The touch request message containing the torrent and expire duration is seconds
message TouchRequest {
  string infoHash = 1;
  int32 expire    = 2 [deprecated=true];
  Caller caller   = 3;
}

// The files request message containing the infoHash
message FilesRequest {
  string infoHash = 1;
  Caller caller   = 2;
}

// A single file entry in a torrent manifest. path is the full path
// components including the torrent name as the first element (matching
// the rest-api file path convention). length is the file size in bytes.
message FileInfo {
  repeated string path = 1;
  int64 length         = 2;
}

// The files response message containing the torrent name and its file
// manifest. Piece hashes are intentionally omitted — they are not needed
// for listing and dominate the .torrent size. private is the BEP 27 flag;
// unset from an old store.
message FilesReply {
  string name             = 1;
  repeated FileInfo files = 2;
  optional bool private   = 3;
}

// The fingerprint request message containing the infoHash
message FingerprintRequest {
  string infoHash = 1;
}

// The fingerprint response. value is the hex SHA-256 covering the torrent's
// piece geometry and piece table; length is the payload bytes it covers, for
// diagnostics only. Exactly one per torrent, so no repetition and no wrapper
// message.
message FingerprintReply {
  reserved 1;              // was `repeated FingerprintInfo fingerprints`
  reserved "fingerprints";
  string value = 2;
  int64 length = 3;
}

message ListPrivateRecordsRequest {
  string uid = 1;
}

// created_at and updated_at are unix seconds, UTC.
message PrivateRecordInfo {
  string info_hash      = 1;
  repeated string hosts = 2;
  string source         = 3;
  int64 created_at      = 4;
  int64 updated_at      = 5;
}

message ListPrivateRecordsReply {
  repeated PrivateRecordInfo records = 1;
}

// Deletes every record of uid.
message DeletePrivateRecordsByUserRequest {
  string uid = 1;
}

// deleted is the number of records deleted.
message DeletePrivateRecordsReply {
  int32 deleted = 1;
}
